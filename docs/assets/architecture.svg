<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" font-family="Helvetica, Arial, sans-serif">
  <title>Badger architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/>
    </marker>
  </defs>

  <rect width="1440" height="960" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="46" font-size="26" font-weight="700" fill="#1b2733">Badger: hardened OpenCode for the enclave</text>
  <text x="40" y="74" font-size="15" fill="#4a5866">Everything runs inside the customer enclave. Administrators decide what the agent can reach; developers cannot widen it.</text>

  <!-- Legend -->
  <rect x="1060" y="30" width="22" height="14" rx="3" fill="#f1f8f4" stroke="#2e7d4f"/>
  <text x="1090" y="42" font-size="12" fill="#4a5866">Available today</text>
  <rect x="1200" y="30" width="22" height="14" rx="3" fill="#ffffff" stroke="#7a8794" stroke-dasharray="5 3"/>
  <text x="1230" y="42" font-size="12" fill="#4a5866">In development</text>

  <!-- Enclave boundary -->
  <rect x="24" y="96" width="1392" height="820" rx="14" fill="none" stroke="#2e7d4f" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="44" y="122" font-size="13" font-weight="700" fill="#2e7d4f" letter-spacing="1">CUSTOMER ENCLAVE</text>

  <!-- ===== Left column: administration ===== -->
  <text x="210" y="152" font-size="13" font-weight="700" fill="#6b7785" text-anchor="middle" letter-spacing="1">ADMINISTRATOR</text>
  <line x1="210" y1="158" x2="210" y2="172" stroke="#2b3a4a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="60" y="176" width="300" height="214" rx="10" fill="#ffffff" stroke="#4a7bb7" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="210" y="204" font-size="16" font-weight="700" fill="#1b2733" text-anchor="middle">Management portal</text>
  <text x="210" y="224" font-size="12" fill="#4a5866" text-anchor="middle">one service, runs offline in the enclave</text>
  <g font-size="13" fill="#1b2733">
    <text x="80" y="254">• Profiles: author, approve, sign</text>
    <text x="80" y="278">• Connectors and their markings</text>
    <text x="80" y="302">• Model gateway and its accreditation</text>
    <text x="80" y="326">• Devices (hardware-bound keys)</text>
    <text x="80" y="350">• Audit log of every admin action</text>
  </g>
  <text x="210" y="376" font-size="11" fill="#6b7785" text-anchor="middle">open API specification</text>


  <!-- Identity -->
  <rect x="60" y="570" width="300" height="96" rx="10" fill="#ffffff" stroke="#7a8794" stroke-dasharray="7 4"/>
  <text x="210" y="600" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Enclave identity and PKI</text>
  <text x="210" y="622" font-size="12" fill="#4a5866" text-anchor="middle">administrators sign in to the portal</text>
  <text x="210" y="639" font-size="12" fill="#4a5866" text-anchor="middle">with the enclave's own certificates</text>

  <!-- Evidence -->
  <rect x="60" y="716" width="300" height="110" rx="10" fill="#ffffff" stroke="#7a8794" stroke-dasharray="7 4"/>
  <text x="210" y="746" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Evidence store</text>
  <text x="210" y="768" font-size="12" fill="#4a5866" text-anchor="middle">signed record of model calls, connector</text>
  <text x="210" y="785" font-size="12" fill="#4a5866" text-anchor="middle">calls and data-flow decisions</text>

  <!-- ===== Center: workstation ===== -->
  <text x="710" y="152" font-size="13" font-weight="700" fill="#6b7785" text-anchor="middle" letter-spacing="1">DEVELOPER</text>
  <line x1="710" y1="158" x2="710" y2="172" stroke="#2b3a4a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="430" y="176" width="560" height="560" rx="12" fill="#ffffff" stroke="#1b2733" stroke-width="2"/>
  <text x="710" y="200" font-size="13" font-weight="700" fill="#6b7785" text-anchor="middle" letter-spacing="1">DEVELOPER WORKSTATION</text>

  <!-- Broker -->
  <rect x="455" y="214" width="510" height="72" rx="10" fill="#f1f8f4" stroke="#2e7d4f"/>
  <text x="710" y="240" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Admission</text>
  <text x="710" y="260" font-size="12" fill="#4a5866" text-anchor="middle">the gateway and session broker act only on a signed profile for this deployment;</text>
  <text x="710" y="276" font-size="12" fill="#4a5866" text-anchor="middle">refuses an expired, misassigned or below-minimum profile</text>

  <!-- Badger core -->
  <rect x="455" y="304" width="510" height="216" rx="10" fill="#1f3b57"/>
  <text x="710" y="336" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Badger</text>
  <text x="710" y="357" font-size="13" fill="#cfe0f1" text-anchor="middle">OpenCode agent and terminal UI, one executable</text>
  <g font-size="13" fill="#ffffff">
    <text x="478" y="390">• Approved configuration compiled in; no plugin or MCP installs</text>
    <text x="478" y="414">• Tool commands isolated by the deployment's VM or container</text>
    <text x="478" y="438">• Credentials redacted from tool output (best effort)</text>
    <text x="478" y="462">• One model route: the approved gateway</text>
  </g>
  <rect x="470" y="474" width="480" height="34" rx="6" fill="none" stroke="#9fc3e6" stroke-dasharray="6 3"/>
  <text x="710" y="496" font-size="13" fill="#ffffff" text-anchor="middle">Classification check: nothing read flows to a lower-accredited destination</text>

  <!-- Connectors -->
  <rect x="455" y="538" width="510" height="180" rx="10" fill="#ffffff" stroke="#4a7bb7" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="710" y="564" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Connectors</text>
  <text x="710" y="583" font-size="12" fill="#4a5866" text-anchor="middle">built by TestifySec, to be turned on per profile by the administrator</text>
  <g font-size="14" font-weight="700" fill="#1b2733" text-anchor="middle">
    <rect x="478" y="598" width="146" height="46" rx="8" fill="#eef4fb" stroke="#4a7bb7"/>
    <text x="551" y="626">Jira</text>
    <rect x="637" y="598" width="146" height="46" rx="8" fill="#eef4fb" stroke="#4a7bb7"/>
    <text x="710" y="626">Confluence</text>
    <rect x="796" y="598" width="146" height="46" rx="8" fill="#eef4fb" stroke="#4a7bb7"/>
    <text x="869" y="626">GitLab</text>
  </g>
  <text x="710" y="672" font-size="12" fill="#4a5866" text-anchor="middle">every result carries its classification banner, e.g. CONFIDENTIAL</text>
  <text x="710" y="692" font-size="12" fill="#4a5866" text-anchor="middle">reads by default; writes only where the profile allows</text>

  <!-- ===== Right column: enclave services ===== -->
  <rect x="1060" y="176" width="320" height="92" rx="10" fill="#f1f8f4" stroke="#2e7d4f"/>
  <text x="1220" y="206" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Model gateway</text>
  <text x="1220" y="228" font-size="12" fill="#4a5866" text-anchor="middle">holds the model credential;</text>
  <text x="1220" y="245" font-size="12" fill="#4a5866" text-anchor="middle">the workstation holds none</text>

  <rect x="1060" y="306" width="320" height="76" rx="10" fill="#f1f8f4" stroke="#2e7d4f"/>
  <text x="1220" y="336" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Approved LLM</text>
  <text x="1220" y="358" font-size="12" fill="#4a5866" text-anchor="middle">accredited to a stated classification</text>
  <line x1="1220" y1="268" x2="1220" y2="302" stroke="#2b3a4a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="1060" y="430" width="320" height="230" rx="10" fill="#f8faf9" stroke="#2e7d4f"/>
  <text x="1220" y="460" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Enclave services</text>
  <g font-size="13" fill="#1b2733" text-anchor="middle">
    <rect x="1086" y="478" width="268" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1"/>
    <text x="1220" y="500">Jira</text>
    <rect x="1086" y="520" width="268" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1"/>
    <text x="1220" y="542">Confluence</text>
    <rect x="1086" y="562" width="268" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1"/>
    <text x="1220" y="584">GitLab</text>
  </g>
  <text x="1220" y="626" font-size="12" fill="#4a5866" text-anchor="middle">each connector reaches only its one service,</text>
  <text x="1220" y="643" font-size="12" fill="#4a5866" text-anchor="middle">as the signed-in developer</text>

  <rect x="1060" y="716" width="320" height="110" rx="10" fill="#f1f8f4" stroke="#2e7d4f"/>
  <text x="1220" y="746" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Pushgate → repository</text>
  <text x="1220" y="768" font-size="12" fill="#4a5866" text-anchor="middle">tests and leak checks must pass</text>
  <text x="1220" y="785" font-size="12" fill="#4a5866" text-anchor="middle">under a signed policy before code lands</text>

  <!-- ===== Flows ===== -->
  <!-- portal -> admission -->
  <line x1="360" y1="250" x2="451" y2="250" stroke="#2b3a4a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="405" y="240" font-size="11" fill="#4a5866" text-anchor="middle">signed</text>
  <text x="405" y="268" font-size="11" fill="#4a5866" text-anchor="middle">profile</text>

  <!-- identity -> workstation -->
  <line x1="360" y1="618" x2="451" y2="618" stroke="#2b3a4a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="405" y="608" font-size="11" fill="#4a5866" text-anchor="middle">sign in</text>

  <!-- workstation -> evidence -->
  <path d="M455,700 L398,700 L398,771 L364,771" stroke="#2b3a4a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="394" y="693" font-size="11" fill="#4a5866" text-anchor="end">evidence</text>

  <!-- badger -> gateway -->
  <path d="M965,420 L1012,420 L1012,222 L1056,222" stroke="#2b3a4a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="1018" y="406" font-size="11" fill="#4a5866">model requests</text>

  <!-- connectors -> services -->
  <line x1="990" y1="621" x2="1056" y2="621" stroke="#2b3a4a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="1023" y="611" font-size="11" fill="#4a5866" text-anchor="middle">API calls</text>

  <!-- workstation -> pushgate -->
  <path d="M710,736 L710,800 L1056,800" stroke="#2b3a4a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="880" y="792" font-size="11" fill="#4a5866" text-anchor="middle">code changes</text>

  <text x="40" y="944" font-size="11" fill="#8a8f96">TestifySec · dashed items are in development and not released</text>
</svg>
